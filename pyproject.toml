[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "fly-swarm"
version = "0.1.0"
description = "Swarm CAPTCHA-Breaker using MaleCNS v1.0 fruit-fly connectome"
requires-python = ">=3.11"
dependencies = [
    "flybrain>=0.1.0",
    "numpy>=2.0",
    "scipy>=1.13",
    "numba>=0.61",
    "scikit-learn>=1.4",
    "pillow>=10.0",
    "opencv-python-headless>=4.8",
    "pytesseract>=0.3.10",
    "psutil>=5.9",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
where = ["."]
include = ["flyswarm*", "eval*", "harvest*", "setup*"]
